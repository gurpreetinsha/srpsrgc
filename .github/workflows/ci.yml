name: SRGC Result Management System CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: srgc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Validate
        run: pnpm prisma validate

      - name: Prisma Generate
        run: pnpm prisma generate

      - name: Type Check (TypeScript strict)
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Run Unit and Integration Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/srgc_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/srgc_test?schema=public"
        run: pnpm test

      - name: Next.js Production Build
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/srgc_test?schema=public"
          DIRECT_URL: "postgresql://postgres:postgrespassword@localhost:5432/srgc_test?schema=public"
          NEXT_PUBLIC_APP_URL: "https://srgc-results.edu.in"
        run: pnpm build

      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high

